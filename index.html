<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Shell</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="brand">App Shell</div>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="#overview">Overview</a></li>
          <li><a href="#analytics">Analytics</a></li>
          <li><a href="#settings">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <header class="topbar">
      <h1>Dashboard</h1>
    </header>

    <main class="content">
      <section class="stat-cards" aria-label="Key metrics">
        <div class="stat-card">Total Users: —</div>
        <div class="stat-card">Total Transactions: —</div>
        <div class="stat-card">Average: —</div>
      </section>

      <section class="chart-placeholder" aria-label="Chart area">
        Chart will be displayed here (Session 11)
      </section>
    </main>

    <footer class="footer">
      <small>Dashboard Shell — Session 2 Practicum</small>
    </footer>
  </div>
</body>
</html>
