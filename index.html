<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Shell</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="brand">App Shell</div>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="#overview">Overview</a></li>
          <li><a href="#analytics">Analytics</a></li>
          <li><a href="#settings">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <header class="topbar">
      <h1>Dashboard</h1>
    </header>

    <section class="stat-cards" aria-label="Key metrics">
        <div class="stat-card">
          <p class="stat-label">Total Users:</p>
          <p class="stat-value" id="stat-users">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Total Transactions:</p>
          <p class="stat-value" id="stat-transactions">—</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">Average:</p>
          <p class="stat-value" id="stat-average">—</p>
        </div>
      </section>

      <section class="chart-placeholder" aria-label="Chart area">
        Chart will be displayed here (Session 11)
      </section>
    </main>

    <footer class="footer">
      <small>Dashboard Shell — Session 2 Practicum</small>
    </footer>
  </div>
  <script>
    const statsData = {
      users: "128",
      transactions: "45",
      average: "Rp4.210.000"
    };

    document.getElementById("stat-users").textContent = statsData.users;
    document.getElementById("stat-transactions").textContent = statsData.transactions;
    document.getElementById("stat-average").textContent = statsData.average;
  </script>
</body>
</html>
